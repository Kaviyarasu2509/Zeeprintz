<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E63312" />

    <!-- ⚠️ These are STATIC fallback tags. Your React <SEOHead> component
    still overrides these per-page once JS loads, for users with JS enabled.
    But search engine bots, WhatsApp, and Facebook link previews often read
    ONLY this raw HTML and never run your JS — so this file must always
    carry good default content, not just a bare <title>. -->

    <title>ZeePrintz Coimbatore - Best Printing Shop for Cards, Flex & Banners</title>
    <meta
      data-rh="true" name="description"
      content="ZeePrintz is a top printing shop in Gandhipuram, Coimbatore for visiting cards, bill books, brochures, invitations, stickers, ID cards, seals & stamps, flex banners and more. Order on WhatsApp."
    />
    <meta
      name="keywords"
      content="printing shop coimbatore, printer shop coimbatore, visiting card printing coimbatore, flex printing coimbatore, bill book printing coimbatore, invitation card printing coimbatore, rubber stamp coimbatore, gandhipuram printing shop"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="ZeePrintz Coimbatore" />
    <link data-rh="true" rel="canonical" href="https://zeeprintz.in/" />

    <!-- Open Graph (WhatsApp / Facebook link previews read these directly) -->
    <meta property="og:title" content="ZeePrintz Coimbatore - Best Printing Shop for Cards, Flex & Banners" />
    <meta
      property="og:description"
      content="Visiting cards, brochures, invitations, stickers, ID cards, seals & stamps, flex banners and more — printed in Gandhipuram, Coimbatore. Order on WhatsApp."
    />
    <meta property="og:type" content="website" />
    <meta data-rh="true" property="og:url" content="https://zeeprintz.in/" />
    <meta property="og:image" content="https://zeeprintz.in/logo512.png" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="ZeePrintz" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZeePrintz Coimbatore - Best Printing Shop for Cards, Flex & Banners" />
    <meta
      name="twitter:description"
      content="Visiting cards, brochures, invitations, stickers, ID cards, seals & stamps, flex banners and more — printed in Gandhipuram, Coimbatore."
    />
    <meta name="twitter:image" content="https://zeeprintz.in/logo512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        "email": "zeeprintzcbe@gmail.com",
        "url": "https://zeeprintz.in",
        "priceRange": "Rs",
        "address": {
          "@type": "PostalAddress",

          "addressLocality": "Coimbatore",
